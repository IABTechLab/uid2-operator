name: Publish GCP OIDC Operator
run-name: ${{ format('Publish {0} GCP OIDC Operator', inputs.release_type) }}
on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: The type of release
        options:
        - Snapshot
        - Patch
        - Minor
        - Major
      version_number_input:
        description: If set, the version number will not be incremented and the given number will be used.
        type: string
        default: ''
      vulnerability_severity:
        description: The severity to fail the workflow if such vulnerability is detected. DO NOT override it unless a Jira ticket is raised. DO NOT use 'CRITICAL' unless a Jira ticket is raised.
        type: choice
        options:
        - CRITICAL,HIGH
        - CRITICAL,HIGH,MEDIUM
        - CRITICAL
  workflow_call:
    inputs:
      release_type:
        description: The type of version number to return. Must be one of [Snapshot, Patch, Minor or Major]
        required: true
        type: string
      version_number_input:
        description: If set, the version number will not be incremented and the given number will be used.
        type: string
        default: ''
      commit_sha:
        description: The commit SHA for committing the new version for pom.xml.
        type: string
        default: ''
      vulnerability_severity:
        description: The severity to fail the workflow if such vulnerability is detected. DO NOT override it unless a Jira ticket is raised. Must be one of ['CRITICAL', 'CRITICAL,HIGH' or 'CRITICAL,HIGH,MEDIUM'] (without space in between).
        type: string
        default: 'CRITICAL,HIGH'

    outputs:
      image_tag:
        description: The tag used to describe the image in Docker
        value: ${{ jobs.buildImage.outputs.image_tag }}

env:
  REGISTRY: ghcr.io
  GCP_REGISTRY: us-docker.pkg.dev
  GCP_GAR_PROJECT: uid2-prod-project
  MAVEN_PROFILE: gcp
  ENCLAVE_PROTOCOL: gcp-oidc
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_CONTEXT_PATH: scripts/gcp-oidc
  ARTIFACTS_OUTPUT_DIR: ${{ github.workspace }}/deployment-artifacts
  MANIFEST_OUTPUT_DIR: ${{ github.workspace }}/manifests

jobs:
  buildImage:
    name: Build Image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_protected && 'ci-auto-merge' || '' }}
    permissions:
      contents: write
      security-events: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    outputs:
      jar_version: ${{ steps.update_version.outputs.new_version }}
      image_tag: ${{ steps.update_version.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update Operator Version
        id: update_version
        uses: ./.github/actions/update_operator_version
        with:
          release_type: ${{ inputs.release_type }}
          version_number_input: ${{ inputs.version_number_input }}
          image_tag_suffix: ${{ env.ENCLAVE_PROTOCOL }}
          commit_sha: ${{ inputs.commit_sha }}
          github_token: ${{ github.ref_protected && secrets.GH_MERGE_TOKEN || '' }}

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Package JAR
        id: package
        run: |
          mvn -B package -P ${{ env.MAVEN_PROFILE }} 
          echo "jar_version=$(mvn help:evaluate -Dexpression=project.version | grep -e '^[1-9][^\[]')" >> $GITHUB_OUTPUT
          echo "git_commit=$(git show --format="%h" --no-patch)" >> $GITHUB_OUTPUT
          cp -r target ${{ env.DOCKER_CONTEXT_PATH }}/
          cp scripts/confidential_compute.py ${{ env.DOCKER_CONTEXT_PATH }}/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.update_version.outputs.image_tag }}

      - name: Extract metadata (tags, labels) for GCP image
        id: meta-gcp
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.GCP_REGISTRY }}/${{ env.GCP_GAR_PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.update_version.outputs.image_tag }}

      - name: Extract metadata (tags, labels) for all Docker images
        id: meta-all
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GCP_REGISTRY }}/${{ env.GCP_GAR_PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.update_version.outputs.new_version }}-${{ env.ENCLAVE_PROTOCOL }}

      - name: Set image repository references
        id: image-refs
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GAR_IMAGE: ${{ env.GCP_REGISTRY }}/${{ env.GCP_GAR_PROJECT }}/${{ env.IMAGE_NAME }}
        run: |
          ghcr_image="$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          gar_image="$(printf '%s' "$GAR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          {
            echo "ghcr=${ghcr_image}"
            echo "gar=${gar_image}"
            echo "all=${ghcr_image},${gar_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and export to Docker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ env.DOCKER_CONTEXT_PATH }}
          load: true
          tags: ${{ steps.meta-all.outputs.tags }}
          labels: ${{ steps.meta-all.outputs.labels }}
          build-args: |
            JAR_VERSION=${{ steps.update_version.outputs.new_version }}
            IMAGE_VERSION=${{ steps.update_version.outputs.new_version }}
            BUILD_TARGET=${{ env.ENCLAVE_PROTOCOL }}

      - name: Vulnerability Scan
        uses: IABTechLab/uid2-shared-actions/actions/vulnerability_scan@v3
        with:
          image_ref: ${{ steps.meta.outputs.tags }}
          scan_type: 'image'
          skip_files: '/venv/lib/python3.12/site-packages/google/auth/crypt/__pycache__/_python_rsa.cpython-312.pyc' # Skip scanning this file as per UID2-4968
          failure_severity: ${{ inputs.vulnerability_severity }}

      # Re-authenticate immediately before registry publish. Build + Trivy can exceed
      # a short-lived GAR token obtained earlier in the job.
      - name: Log in to the Docker container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate with Google Cloud
        id: gcp_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_ID }}
          service_account: ${{ vars.GCP_PUBLISH_SERVICE_ACCOUNT }}
          access_token_lifetime: 3600s

      - name: Log in to the GCP Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.GCP_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Push to registries by digest
        id: push-to-docker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ env.DOCKER_CONTEXT_PATH }}
          labels: ${{ steps.meta-all.outputs.labels }}
          # Quote name= so commas inside the multi-registry value are not parsed as CSV separators.
          outputs: type=image,"name=${{ steps.image-refs.outputs.all }}",oci-mediatypes=false,push-by-digest=true,push=true
          # Keep the private image as a plain single-platform manifest. Signed
          # SLSA provenance is added separately by attest_image below.
          provenance: false
          build-args: |
            JAR_VERSION=${{ steps.update_version.outputs.new_version }}
            IMAGE_VERSION=${{ steps.update_version.outputs.new_version }}
            BUILD_TARGET=${{ env.ENCLAVE_PROTOCOL }}

      - name: Attest GHCR image
        if: ${{ !contains(steps.update_version.outputs.new_version, 'SNAPSHOT') }}
        uses: IABTechLab/uid2-shared-actions/actions/attest_image@v3
        with:
          subject_name: ${{ steps.image-refs.outputs.ghcr }}
          subject_digest: ${{ steps.push-to-docker.outputs.digest }}

      - name: Verify GHCR attestation from registry
        if: ${{ !contains(steps.update_version.outputs.new_version, 'SNAPSHOT') }}
        uses: ./.github/actions/verify_oci_attestation
        with:
          subject_name: ${{ steps.image-refs.outputs.ghcr }}
          subject_digest: ${{ steps.push-to-docker.outputs.digest }}
          signer_workflow: ${{ github.repository }}/.github/workflows/publish-gcp-oidc-enclave-docker.yaml

      - name: Attest GAR image
        if: ${{ !contains(steps.update_version.outputs.new_version, 'SNAPSHOT') }}
        uses: IABTechLab/uid2-shared-actions/actions/attest_image@v3
        with:
          subject_name: ${{ steps.image-refs.outputs.gar }}
          subject_digest: ${{ steps.push-to-docker.outputs.digest }}

      - name: Verify GAR attestation from registry
        if: ${{ !contains(steps.update_version.outputs.new_version, 'SNAPSHOT') }}
        uses: ./.github/actions/verify_oci_attestation
        with:
          subject_name: ${{ steps.image-refs.outputs.gar }}
          subject_digest: ${{ steps.push-to-docker.outputs.digest }}
          signer_workflow: ${{ github.repository }}/.github/workflows/publish-gcp-oidc-enclave-docker.yaml

      - name: Promote digest to registry tags
        env:
          DIGEST: ${{ steps.push-to-docker.outputs.digest }}
          GHCR_IMAGE: ${{ steps.image-refs.outputs.ghcr }}
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          GAR_IMAGE: ${{ steps.image-refs.outputs.gar }}
          GAR_TAGS: ${{ steps.meta-gcp.outputs.tags }}
        run: |
          set -euo pipefail

          promote_tags() {
            local image="$1"
            local tags="$2"
            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              docker buildx imagetools create --prefer-index=false -t "$tag" "${image}@${DIGEST}"
            done <<< "$tags"
          }

          verify_tags() {
            local image="$1"
            local tags="$2"
            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              resolved="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
              if [[ "$resolved" != "$DIGEST" ]]; then
                echo "::error::Promoted tag $tag resolved to $resolved, expected $DIGEST"
                exit 1
              fi
            done <<< "$tags"
          }

          # Promote GAR before GHCR so a mid-promotion failure is less likely to
          # leave the more widely consumed GHCR version tag published alone.
          promote_tags "$GAR_IMAGE" "$GAR_TAGS"
          promote_tags "$GHCR_IMAGE" "$GHCR_TAGS"
          verify_tags "$GAR_IMAGE" "$GAR_TAGS"
          verify_tags "$GHCR_IMAGE" "$GHCR_TAGS"

      - name: Generate GCP deployment artifacts
        env:
          IMAGE: ${{ steps.meta-gcp.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push-to-docker.outputs.digest }}
          OUTPUT_DIR: ${{ env.ARTIFACTS_OUTPUT_DIR }}
          MANIFEST_DIR: ${{ env.MANIFEST_OUTPUT_DIR}}
          VERSION_NUMBER: ${{ steps.update_version.outputs.new_version }}
        run: |
          bash ./scripts/gcp-oidc/generate-deployment-artifacts.sh

      - name: Attest manifest artifacts
        if: ${{ !contains(steps.update_version.outputs.new_version, 'SNAPSHOT') }}
        uses: ./.github/actions/attest_file
        with:
          subject_paths: |
            ${{ env.MANIFEST_OUTPUT_DIR }}/gcp-oidc-enclave-id-${{ steps.update_version.outputs.new_version }}.txt
            ${{ env.MANIFEST_OUTPUT_DIR }}/gcp-oidc-enclave-id-debug-${{ steps.update_version.outputs.new_version }}.txt
          signer_workflow: ${{ github.repository }}/.github/workflows/publish-gcp-oidc-enclave-docker.yaml

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-oidc-deployment-files-${{ steps.update_version.outputs.new_version }}
          path: ${{ env.ARTIFACTS_OUTPUT_DIR }}
          if-no-files-found: error

      - name: Upload manifest artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-oidc-enclave-ids-${{ steps.update_version.outputs.new_version }}
          path: ${{ env.MANIFEST_OUTPUT_DIR }}
          if-no-files-found: error

      - name: Generate release archive
        if: ${{ inputs.version_number_input == '' && steps.update_version.outputs.is_release == 'true' }}
        run: |
            zip -j ${{ env.ARTIFACTS_OUTPUT_DIR }}/gcp-oidc-deployment-files-${{ steps.update_version.outputs.new_version }}.zip ${{ env.ARTIFACTS_OUTPUT_DIR }}/*

      - name: Attest release archive
        if: ${{ inputs.version_number_input == '' && steps.update_version.outputs.is_release == 'true' }}
        uses: ./.github/actions/attest_file
        with:
          subject_paths: ${{ env.ARTIFACTS_OUTPUT_DIR }}/gcp-oidc-deployment-files-${{ steps.update_version.outputs.new_version }}.zip
          signer_workflow: ${{ github.repository }}/.github/workflows/publish-gcp-oidc-enclave-docker.yaml

      - name: Build changelog
        id: github_release
        if: ${{ inputs.version_number_input == '' && steps.update_version.outputs.is_release == 'true' }}
        uses: mikepenz/release-changelog-builder-action@348e88fab4c37338b1e803ceb2d4a7a5db6c0833 # v6.2.2
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n## Installation\n```\ndocker pull ${{ steps.meta.outputs.tags }}\n```\n\n## Image reference to deploy: \n```\n${{ steps.update_version.outputs.image_tag }}\n```\n\n## Changelog\n#{{UNCATEGORIZED}}",
              "pr_template": " - #{{TITLE}} - ( PR: ##{{NUMBER}} )"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: ${{ inputs.version_number_input == '' && steps.update_version.outputs.is_release == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: ${{ steps.update_version.outputs.new_version }}
          body: ${{ steps.github_release.outputs.changelog }}
          draft: true
          files: |
            ${{ env.ARTIFACTS_OUTPUT_DIR }}/gcp-oidc-deployment-files-${{ steps.update_version.outputs.new_version }}.zip
            ${{ env.MANIFEST_OUTPUT_DIR }}/gcp-oidc-enclave-id-${{ steps.update_version.outputs.new_version }}.txt
            ${{ env.MANIFEST_OUTPUT_DIR }}/gcp-oidc-enclave-id-debug-${{ steps.update_version.outputs.new_version }}.txt

  e2e:
    name: E2E
    uses: ./.github/workflows/run-e2e-tests-on-operator.yaml
    needs: buildImage
    with:
      operator_type: gcp
      operator_image_version: ${{ needs.buildImage.outputs.image_tag }}
    secrets: inherit
